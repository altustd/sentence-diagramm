[workspace]
name = "sentence-diagramm"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[dependencies]
python = ">=3.12,<3.13"
streamlit = "*"
spacy = "*"
pandas = "*"
pip = "*"

[tasks]
app = "streamlit run app.py"
cli = "python cli.py"
download-models = "python -m spacy download en_core_web_sm && python -m spacy download de_core_news_sm"
